name: Publicar personaje diario

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar aunque ya se haya publicado hoy"
        type: boolean
        default: false

  repository_dispatch:
    types: [publicar-personaje]

permissions:
  contents: write

concurrency:
  group: publicar-personaje
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests tzdata

      - name: Publicar personaje
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
          FORZAR: ${{ inputs.forzar }}
        run: python publicar_diario.py

      - name: Guardar estado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Actualizar estado diario" && git push)
